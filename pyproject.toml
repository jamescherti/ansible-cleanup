[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-cleanup"
version = "0.9.9"
description = "Utilities for detecting unused imports and variables in Ansible projects"
readme = "README.md"
authors = [
  { name = "James Cherti" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "ansible-core>=2.14.0",
]
keywords = [
  "ansible",
  "cleanup",
  "lint",
  "static-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jamescherti/ansible-cleanup"
Repository = "https://github.com/jamescherti/ansible-cleanup"

[project.scripts]
ansible-cleanup = "ansible_cleanup.cli:main"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
